app = "nova-khvylia"
primary_region = "ams"
swap_size_mb = 512

[deploy]
release_command = 'python -c "import app"'

[http_service]
auto_start_machines = true
auto_stop_machines = false
force_https = false
internal_port = 8080
min_machines_running = 1
processes = [ "app" ]

[processes]
app = "gunicorn --bind :8080 --workers 1 --threads 2 --timeout 120 --access-logfile - --error-logfile - --log-level info app:app"

[[statics]]
guest_path = "/app/static"
tigris_bucket = ""
url_prefix = "/static/"

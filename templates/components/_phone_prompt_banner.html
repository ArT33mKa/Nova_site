{% if current_user.is_authenticated and not current_user.phone and not session.get('hide_phone_prompt') %}
<div id="phone-prompt-banner" style="background: var(--color-brand-primary); color: white; padding: 12px; position: relative; z-index: 1001; text-align: center;">
    <div class="container" style="display: flex; justify-content: center; align-items: center; gap: 15px;">
        <span>💡 Будь ласка, додайте номер телефону для швидкого оформлення замовлень.</span>
        <a href="{{ url_for('profile_settings') }}" style="text-decoration: underline; font-weight: 600;">Додати номер</a>
        <button id="close-phone-prompt" style="background: none; border: none; color: white; cursor: pointer; font-size: 1.2rem; opacity: 0.8;">&times;</button>
    </div>
</div>
{% endif %}
